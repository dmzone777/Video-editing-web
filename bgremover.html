<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Background Remover</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            display: flex;
            flex-direction: column; /* Isse content aur ads upar-niche aayenge */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        .file-input {
            margin: 20px 0;
            padding: 10px;
            border: 2px dashed #007bff;
            border-radius: 8px;
            background: #f8f9fa;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .btn-manual { background-color: #28a745; }
        .btn-manual:hover { background-color: #218838; }
        
        .loader {
            display: none;
            color: #007bff;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* Result Area */
        .result-box { display: none; margin-top: 20px; }
        
        /* Auto Mode Image */
        #outputImage { max-width: 100%; border-radius: 8px; display: none; margin: 0 auto; }
        
        /* Manual Mode Canvas */
        #canvasContainer {
            display: none;
            position: relative;
            margin: 10px auto;
            border: 2px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAMUlEQVQ4T2NkYGAQYcAP3uCTZhw1gGGYhAGBZIA/O5wEGxsb4yCTMAwzGjZggmFAAgBcEQIEioyX6wAAAABJRU5ErkJggg=='); /* Checkerboard pattern for transparency */
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: crosshair;
        }
        
        .brush-controls {
            display: none;
            margin: 15px 0;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✂️ Pro BG Remover</h1>
    <p>1-Click Auto Remove (API) ya Manual Eraser Tool use karein</p>
    
    <div class="file-input">
        <input type="file" id="fileInput" accept="image/*">
    </div>
    
    <div class="controls">
        <button id="autoBtn" onclick="autoRemoveBackground()">🤖 Auto Remove (API)</button>
        <button id="manualBtn" class="btn-manual" onclick="startManualMode()">🖐️ Manual Erase</button>
    </div>

    <div class="loader" id="loader">Processing... Kripya thoda intezaar karein...</div>
    
    <div class="brush-controls" id="brushControls">
        <label for="brushSize">Eraser Size: </label>
        <input type="range" id="brushSize" min="5" max="100" value="30">
        <span id="brushSizeVal">30px</span>
    </div>

    <div class="result-box" id="resultBox">
        <img id="outputImage" src="" alt="Auto Output">
        
        <div id="canvasContainer">
            <canvas id="imageCanvas"></canvas>
        </div>
        
        <br><br>
        <button onclick="downloadImage()" id="downloadBtn">⬇️ Download Image</button>
    </div>
</div>

<script>
    // Aapki di hui API Key yahan add kardi gayi hai
    const API_KEY = "bpHVh8R3Wn7DzaU35MubgXrJ"; 
    
    let currentMode = ''; // 'auto' or 'manual'
    let isDrawing = false;
    
    const fileInput = document.getElementById('fileInput');
    const resultBox = document.getElementById('resultBox');
    const outputImage = document.getElementById('outputImage');
    const canvasContainer = document.getElementById('canvasContainer');
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const brushControls = document.getElementById('brushControls');
    const brushSizeInput = document.getElementById('brushSize');
    
    // Update brush size display
    brushSizeInput.addEventListener('input', function() {
        document.getElementById('brushSizeVal').innerText = this.value + 'px';
    });

    // --- 1. AUTO REMOVE (API) LOGIC ---
    async function autoRemoveBackground() {
        if (!checkFile()) return;
        currentMode = 'auto';
        
        const file = fileInput.files[0];
        document.getElementById('loader').style.display = 'block';
        resetUI();

        const formData = new FormData();
        formData.append('image_file', file);
        formData.append('size', 'auto');

        try {
            const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                method: 'POST',
                headers: { 'X-Api-Key': API_KEY },
                body: formData
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                outputImage.src = url;
                outputImage.style.display = 'block';
                canvasContainer.style.display = 'none';
                resultBox.style.display = 'block';
            } else {
                alert("API Error: " + response.statusText + " (Check API Key Credits)");
            }
        } catch (error) {
            console.error(error);
            alert("Network error occurred.");
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    }

    // --- 2. MANUAL ERASE LOGIC ---
    function startManualMode() {
        if (!checkFile()) return;
        currentMode = 'manual';
        resetUI();
        
        const file = fileInput.files[0];
        const img = new Image();
        img.src = URL.createObjectURL(file);
        
        img.onload = () => {
            // Set canvas exact dimensions as image
            canvas.width = img.width;
            canvas.height = img.height;
            
            // Draw image on canvas
            ctx.globalCompositeOperation = 'source-over';
            ctx.drawImage(img, 0, 0);
            
            outputImage.style.display = 'none';
            canvasContainer.style.display = 'block';
            brushControls.style.display = 'flex';
            resultBox.style.display = 'block';
        }
    }

    // Erasing events for Canvas (Mouse & Touch)
    canvas.addEventListener('mousedown', startErasing);
    canvas.addEventListener('mousemove', erase);
    canvas.addEventListener('mouseup', stopErasing);
    canvas.addEventListener('mouseleave', stopErasing);
    
    // For mobile touch
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startErasing(e.touches[0]); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); erase(e.touches[0]); });
    canvas.addEventListener('touchend', stopErasing);

    function startErasing(e) {
        isDrawing = true;
        erase(e);
    }

    function stopErasing() {
        isDrawing = false;
        ctx.beginPath(); // Reset path
    }

    function erase(e) {
        if (!isDrawing) return;
        
        const rect = canvas.getBoundingClientRect();
        // Calculate correct coordinates relative to original image size vs screen display size
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        
        const brushSize = parseInt(brushSizeInput.value);

        // 'destination-out' acts as an eraser making pixels transparent
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = brushSize;
        ctx.lineCap = 'round';
        
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    // --- UTILS ---
    function checkFile() {
        if (fileInput.files.length === 0) {
            alert("Pehle ek image select karein!");
            return false;
        }
        return true;
    }

    function resetUI() {
        brushControls.style.display = 'none';
        resultBox.style.display = 'none';
    }

    function downloadImage() {
        const link = document.createElement('a');
        link.download = 'bg-removed.png';
        
        if (currentMode === 'auto') {
            link.href = outputImage.src;
        } else if (currentMode === 'manual') {
            link.href = canvas.toDataURL('image/png');
        }
        
        link.click();
    }
</script>

<div style="width: 100%; max-width: 600px; text-align: center; margin-top: 35px; display: block; clear: both;">
    <script async="async" data-cfasync="false" src="https://pl29620669.effectivecpmnetwork.com/6538d45e194262f6dc2f234c93ffc24c/invoke.js"></script>
    <div id="container-6538d45e194262f6dc2f234c93ffc24c"></div>
</div>

</body>
</html>
