<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Background Remover</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 24px;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
            color: #6b7280;
        }

        .main-container {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Sidebar/Toolbar Style */
        .toolbar {
            flex: 1;
            min-width: 250px;
            border-right: 1px solid var(--border-color);
            padding-right: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tool-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tool-section h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4b5563;
        }

        /* Custom Upload Button */
        .file-upload-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .file-upload-btn:hover {
            background-color: var(--primary-hover);
        }

        input[type="file"] {
            display: none;
        }

        /* Mode Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
            border: none;
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-success {
            background-color: #10b981;
            color: white;
            border: none;
            margin-top: auto;
            padding: 12px;
            font-size: 16px;
        }
        .btn-success:hover {
            background-color: #059669;
        }

        /* Slider */
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .slider-container label {
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        /* Canvas/Workspace Area */
        .workspace {
            flex: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f3f4f6;
            border-radius: 8px;
            min-height: 450px;
            position: relative;
            overflow: auto;
            /* Transparent Background Grid Effect */
            background-image: linear-gradient(45deg, #cbd5e1 25%, transparent 25%), 
                              linear-gradient(-45deg, #cbd5e1 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #cbd5e1 75%), 
                              linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        #canvasContainer {
            position: relative;
            max-width: 100%;
            max-height: 100%;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            cursor: crosshair;
        }

        .placeholder-text {
            color: #9ca3af;
            font-size: 16px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .toolbar {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding-right: 0;
                padding-bottom: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Manual Background Remover</h1>
        <p>Apni image upload karein aur brush se background erase karein</p>
    </header>

    <div class="main-container">
        <div class="toolbar">
            <div class="tool-section">
                <h3>1. Image Select Karein</h3>
                <label class="file-upload-btn" for="imageLoader">Upload Image</label>
                <input type="file" id="imageLoader" accept="image/*">
            </div>

            <div class="tool-section">
                <h3>2. Tools</h3>
                <div class="btn-group">
                    <button id="eraseMode" class="btn active">Erase (Mitao)</button>
                    <button id="restoreMode" class="btn">Restore (Wapas Lao)</button>
                </div>
            </div>

            <div class="tool-section slider-container">
                <label for="brushSize">Brush Size: <span id="sizeVal">30</span>px</label>
                <input type="range" id="brushSize" min="5" max="100" value="30">
            </div>

            <div class="tool-section">
                <button id="clearBtn" class="btn btn-danger">Reset Image</button>
            </div>

            <button id="downloadBtn" class="btn btn-success" disabled>Download PNG</button>
        </div>

        <div class="workspace">
            <div id="canvasContainer">
                <div id="placeholder" class="placeholder-text">Shuru karne ke liye image upload karein.</div>
                <canvas id="imageCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        
        // Controls
        const eraseModeBtn = document.getElementById('eraseMode');
        const restoreModeBtn = document.getElementById('restoreMode');
        const brushSizeSlider = document.getElementById('brushSize');
        const sizeVal = document.getElementById('sizeVal');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalImage = new Image();
        let isDrawing = false;
        let currentMode = 'erase'; // erase ya restore
        let brushSize = 30;

        // Image upload handle karne ke liye
        imageLoader.addEventListener('change', handleImage, false);

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                originalImage.onload = function() {
                    // Canvas size set karein image ke hissab se
                    canvas.width = originalImage.width;
                    canvas.height = originalImage.height;
                    
                    // Image ko canvas par draw karein
                    ctx.drawImage(originalImage, 0, 0);
                    
                    placeholder.style.display = 'none';
                    downloadBtn.disabled = false;
                }
                originalImage.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        // Mode Switching (Erase / Restore)
        eraseModeBtn.addEventListener('click', () => {
            currentMode = 'erase';
            eraseModeBtn.classList.add('active');
            restoreModeBtn.classList.remove('active');
        });

        restoreModeBtn.addEventListener('click', () => {
            currentMode = 'restore';
            restoreModeBtn.classList.add('active');
            eraseModeBtn.classList.remove('active');
        });

        // Brush Size Change
        brushSizeSlider.addEventListener('input', (e) => {
            brushSize = e.target.value;
            sizeVal.textContent = brushSize;
        });

        // Drawing / Erasing Logic
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch support for mobiles
        canvas.addEventListener('touchstart', (e) => { startDrawing(e.touches[0]); });
        canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); e.preventDefault(); });
        canvas.addEventListener('touchend', stopDrawing);

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            // Scale factors calculate karte hain agar canvas CSS se chota/bada dikh raha ho
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            return {
                x: (evt.clientX - rect.left) * scaleX,
                y: (evt.clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            if (!originalImage.src) return;
            isDrawing = true;
            draw(e);
        }

        function draw(e) {
            if (!isDrawing) return;

            const pos = getMousePos(e);

            ctx.save();
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2);

            if (currentMode === 'erase') {
                // Erase karne ke liye pixels ko transparent banate hain
                ctx.clip();
                ctx.clearRect(pos.x - brushSize, pos.y - brushSize, brushSize * 2, brushSize * 2);
            } else {
                // Restore karne ke liye original image se pixels wapas copy karte hain
                ctx.clip();
                ctx.drawImage(originalImage, 0, 0);
            }
            ctx.restore();
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath(); // path reset karne ke liye
        }

        // Reset Button
        clearBtn.addEventListener('click', () => {
            if (originalImage.src) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(originalImage, 0, 0);
            }
        });

        // Download PNG Button
        downloadBtn.addEventListener('click', () => {
            if (!originalImage.src) return;
            
            const link = document.createElement('a');
            link.download = 'background_removed.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script><script async="async" data-cfasync="false" src="https://pl29620669.effectivecpmnetwork.com/6538d45e194262f6dc2f234c93ffc24c/invoke.js"></script>

</body>
</html>
