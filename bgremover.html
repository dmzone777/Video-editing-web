<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manual Background Remover</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            overflow-x: hidden;
        }

        header {
            margin-bottom: 12px;
            text-align: center;
        }

        header h1 {
            font-size: 20px;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        header p {
            font-size: 12px;
            color: #6b7280;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Toolbar Style for Mobile */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tool-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tool-section h3 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4b5563;
        }

        /* Custom Upload Button */
        .file-upload-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        /* Mode Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
            border: none;
        }
        
        .btn-success {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
        }

        /* Slider */
        .slider-container {
            background: #f9fafb;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        
        .slider-container label {
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }

        input[type=range] {
            width: 100%;
            margin-top: 8px;
        }

        /* Canvas/Workspace Area */
        .workspace {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f3f4f6;
            border-radius: 8px;
            min-height: 300px;
            max-height: 350px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            /* Transparent Background Grid Effect */
            background-image: linear-gradient(45deg, #cbd5e1 25%, transparent 25%), 
                              linear-gradient(-45deg, #cbd5e1 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #cbd5e1 75%), 
                              linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        #canvasContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            max-width: 100%;
            max-height: 330px;
            width: auto;
            height: auto;
            cursor: crosshair;
            touch-action: none; /* Prevents mobile scrolling/zooming while drawing */
        }

        .placeholder-text {
            color: #9ca3af;
            font-size: 14px;
            text-align: center;
            position: absolute;
        }
    </style>
</head>
<body>

    <header>
        <h1>Manual BG Remover</h1>
        <p>Upload image & use brush to erase background</p>
    </header>

    <div class="main-container">
        <div class="toolbar">
            <div class="tool-section">
                <h3>1. Select Image</h3>
                <label class="file-upload-btn" for="imageLoader">Upload Image</label>
                <input type="file" id="imageLoader" accept="image/*">
            </div>

            <div class="tool-section">
                <h3>2. Tools</h3>
                <div class="btn-group">
                    <button id="eraseMode" class="btn active">Erase</button>
                    <button id="restoreMode" class="btn">Restore</button>
                </div>
            </div>

            <div class="tool-section slider-container">
                <label for="brushSize">Brush Size: <span id="sizeVal">30</span>px</label>
                <input type="range" id="brushSize" min="5" max="100" value="30">
            </div>

            <div class="tool-section">
                <button id="clearBtn" class="btn btn-danger">Reset Image</button>
            </div>

            <button id="downloadBtn" class="btn btn-success" disabled>Download PNG</button>
        </div>

        <div class="workspace">
            <div id="canvasContainer">
                <div id="placeholder" class="placeholder-text">Upload an image to get started.</div>
                <canvas id="imageCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const placeholder = document.getElementById('placeholder');
        
        // Controls
        const eraseModeBtn = document.getElementById('eraseMode');
        const restoreModeBtn = document.getElementById('restoreMode');
        const brushSizeSlider = document.getElementById('brushSize');
        const sizeVal = document.getElementById('sizeVal');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalImage = new Image();
        let isDrawing = false;
        let currentMode = 'erase';
        let brushSize = 30;

        // Handle image upload
        imageLoader.addEventListener('change', handleImage, false);

        function handleImage(e) {
            if (!e.target.files || !e.target.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                originalImage.onload = function() {
                    canvas.width = originalImage.width;
                    canvas.height = originalImage.height;
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(originalImage, 0, 0);
                    
                    placeholder.style.display = 'none';
                    downloadBtn.disabled = false;
                }
                originalImage.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        // Mode Switching 
        eraseModeBtn.addEventListener('click', () => {
            currentMode = 'erase';
            eraseModeBtn.classList.add('active');
            restoreModeBtn.classList.remove('active');
        });

        restoreModeBtn.addEventListener('click', () => {
            currentMode = 'restore';
            restoreModeBtn.classList.add('active');
            eraseModeBtn.classList.remove('active');
        });

        // Brush Size Change
        brushSizeSlider.addEventListener('input', (e) => {
            brushSize = e.target.value;
            sizeVal.textContent = brushSize;
        });

        // Drawing / Erasing Logic
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        // Touch support for mobiles
        canvas.addEventListener('touchstart', (e) => {
            startDrawing(e.touches[0]);
            e.preventDefault();
        }, { passive: false });
        
        canvas.addEventListener('touchmove', (e) => {
            draw(e.touches[0]);
            e.preventDefault();
        }, { passive: false });
        
        canvas.addEventListener('touchend', stopDrawing);

        function getPos(evt) {
            const rect = canvas.getBoundingClientRect();
            // Calculate accurate scaling factor for touch/mouse relative to canvas resolution
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            return {
                x: (evt.clientX - rect.left) * scaleX,
                y: (evt.clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            if (!originalImage.src) return;
            isDrawing = true;
            draw(e);
        }

        function draw(e) {
            if (!isDrawing) return;

            const pos = getPos(e);

            ctx.save();
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, brushSize / 2, 0, Math.PI * 2);
            ctx.clip();

            if (currentMode === 'erase') {
                ctx.clearRect(pos.x - brushSize, pos.y - brushSize, brushSize * 2, brushSize * 2);
            } else {
                // Restore pixels by clipping from the original image data
                ctx.clearRect(pos.x - brushSize, pos.y - brushSize, brushSize * 2, brushSize * 2);
                ctx.drawImage(originalImage, 0, 0);
            }
            ctx.restore();
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        // Reset Button
        clearBtn.addEventListener('click', () => {
            if (originalImage.src) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(originalImage, 0, 0);
            }
        });

        // Download PNG Button
        downloadBtn.addEventListener('click', () => {
            if (!originalImage.src) return;
            
            const link = document.createElement('a');
            link.download = 'background_removed.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
