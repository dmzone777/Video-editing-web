<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Optimized Audio Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #e2e8f0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1a1a1e;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        h1 {
            text-align: center;
            font-size: 22px;
            color: #4fc3f7;
            margin-bottom: 20px;
        }
        .file-box {
            text-align: center;
            border: 2px dashed #3a3a44;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            background: #222227;
        }
        input[type="file"] { display: none; }
        .upload-btn {
            background: #4fc3f7;
            color: #121214;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
            cursor: pointer;
            font-size: 15px;
        }
        #audioPlayer {
            width: 100%;
            margin-top: 15px;
            display: none;
        }
        .status {
            text-align: center;
            color: #ffd54f;
            font-size: 14px;
            margin: 10px 0;
            display: none;
        }
        .section-title {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 10px;
            border-left: 3px solid #4fc3f7;
            padding-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tool-box {
            background: #222227;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .control-row:last-child { margin-bottom: 0; }
        label { font-size: 14px; color: #cbd5e1; }
        input[type="range"] {
            width: 60%;
            accent-color: #4fc3f7;
        }
        .value-tag {
            font-size: 13px;
            color: #4fc3f7;
            min-width: 40px;
            text-align: right;
        }
        .cut-inputs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .cut-inputs input {
            width: 50%;
            background: #1a1a1e;
            border: 1px solid #3a3a44;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ff5252;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        button:active { opacity: 0.8; }
        button:disabled {
            background: #3a3a44 !important;
            color: #64748b !important;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #3a3a44;
            color: #fff;
        }
        .btn-download {
            background: #00e676;
            color: #121214;
            font-size: 16px;
            margin-top: 10px;
        }
        /* Mobile Waveform Simulation Display */
        #timeDisplay {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mobile Audio Studio</h1>

    <div class="file-box">
        <label class="upload-btn">
            <input type="file" id="audioFile" accept="audio/*">
            Select Audio Track
        </label>
        <div id="fileName" style="margin-top: 10px; font-size: 13px; color: #94a3b8;"></div>
        <audio id="audioPlayer" controls></audio>
        <div id="timeDisplay">Duration: 0:00</div>
    </div>

    <div id="statusText" class="status">Loading mobile audio engine...</div>

    <div class="tool-box">
        <div class="section-title">Manual Silence Remover (Cut)</div>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">
            Listen to audio, note down times, and enter them below to cut multiple parts.
        </p>
        <div class="cut-inputs">
            <input type="number" id="cutStart" placeholder="Start (seconds)" step="0.1" min="0">
            <input type="number" id="cutEnd" placeholder="End (seconds)" step="0.1" min="0">
        </div>
        <div style="display: flex; gap: 8px;">
            <button id="btnUseCurrentStart" class="btn-secondary" style="font-size: 11px; padding: 6px;" disabled>Use Current Time As Start</button>
            <button id="btnUseCurrentEnd" class="btn-secondary" style="font-size: 11px; padding: 6px;" disabled>Use Current Time As End</button>
        </div>
        <button id="btnDeleteSelected" disabled>Delete Selected Part</button>
    </div>

    <div class="tool-box">
        <div class="section-title">Audio Effects</div>
        
        <div class="control-row">
            <label for="speedSlider">Speed</label>
            <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0">
            <span class="value-tag" id="speedVal">1.0x</span>
        </div>

        <div class="control-row">
            <label for="bassSlider">Bass</label>
            <input type="range" id="bassSlider" min="-10" max="15" step="1" value="0">
            <span class="value-tag" id="bassVal">0dB</span>
        </div>

        <div class="control-row">
            <label for="reverbSlider">Reverb</label>
            <input type="range" id="reverbSlider" min="0" max="100" step="5" value="0">
            <span class="value-tag" id="reverbVal">0%</span>
        </div>
    </div>

    <button id="btnDownload" class="btn-download" disabled>Download Audio (WAV)</button>
</div>

<script>
    let audioCtx, originalBuffer, currentBuffer;
    let bassNode, delayNode, reverbGain;
    const player = document.getElementById('audioPlayer');

    // Load Audio File on Mobile Safely
    document.getElementById('audioFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('fileName').innerText = file.name;
        document.getElementById('statusText').style.display = "block";
        document.getElementById('statusText').innerText = "Reading audio data...";

        // Step 1: Load into HTML5 Player immediately for quick native playback
        const fileURL = URL.createObjectURL(file);
        player.src = fileURL;
        player.style.display = "block";

        // Step 2: Decode for Editing Processing
        const reader = new FileReader();
        reader.onload = function(evt) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            audioCtx.decodeAudioData(evt.target.result).then(buffer => {
                originalBuffer = buffer;
                currentBuffer = buffer;
                
                updateDurationDisplay();
                
                // Enable Buttons
                document.getElementById('btnDeleteSelected').disabled = false;
                document.getElementById('btnUseCurrentStart').disabled = false;
                document.getElementById('btnUseCurrentEnd').disabled = false;
                document.getElementById('btnDownload').disabled = false;
                
                document.getElementById('statusText').style.display = "none";
            }).catch(err => {
                alert("Mobile Engine Error: Please try another short audio track.");
                document.getElementById('statusText').style.display = "none";
            });
        };
        reader.readAsArrayBuffer(file);
    });

    // Helper to sync time from player
    document.getElementById('btnUseCurrentStart').addEventListener('click', () => {
        document.getElementById('cutStart').value = player.currentTime.toFixed(1);
    });
    document.getElementById('btnUseCurrentEnd').addEventListener('click', () => {
        document.getElementById('cutEnd').value = player.currentTime.toFixed(1);
    });

    function updateDurationDisplay() {
        if (!currentBuffer) return;
        const mins = Math.floor(currentBuffer.duration / 60);
        const secs = Math.floor(currentBuffer.duration % 60);
        document.getElementById('timeDisplay').innerText = `Duration: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // --- MOBILE AUDIO EFFECTS EFFECTS (REAL-TIME VIA PLAYER) ---
    document.getElementById('speedSlider').addEventListener('input', function(e) {
        const val = parseFloat(e.target.value);
        document.getElementById('speedVal').innerText = val.toFixed(1) + 'x';
        player.defaultPlaybackRate = val;
        player.playbackRate = val;
    });

    // Note: Bass & Reverb use precise post-processing for mobile export
    document.getElementById('bassSlider').addEventListener('input', function(e) {
        document.getElementById('bassVal').innerText = e.target.value + 'dB';
    });
    document.getElementById('reverbSlider').addEventListener('input', function(e) {
        document.getElementById('reverbVal').innerText = e.target.value + '%';
    });


    // --- MANUAL SILENCE REMOVER (MULTIPLE TIME CUTTER) ---
    document.getElementById('btnDeleteSelected').addEventListener('click', () => {
        if (!currentBuffer) return;
        
        const startCut = parseFloat(document.getElementById('cutStart').value);
        const endCut = parseFloat(document.getElementById('cutEnd').value);

        if (isNaN(startCut) || isNaN(endCut) || startCut >= endCut || startCut >= currentBuffer.duration) {
            alert("Please enter a valid Start and End time in seconds.");
            return;
        }

        document.getElementById('statusText').style.display = "block";
        document.getElementById('statusText').innerText = "Cutting selected part...";

        setTimeout(() => {
            const sampleRate = currentBuffer.sampleRate;
            const totalDuration = currentBuffer.duration;
            
            const startSample = Math.floor(startCut * sampleRate);
            const endSample = Math.floor(Math.min(endCut, totalDuration) * sampleRate);
            const cutLength = endSample - startSample;
            
            const newLength = currentBuffer.length - cutLength;
            if (newLength <= 0) {
                alert("Error: Cannot delete the entire audio track!");
                return;
            }

            const newBuffer = audioCtx.createBuffer(currentBuffer.numberOfChannels, newLength, sampleRate);

            for (let channel = 0; channel < currentBuffer.numberOfChannels; channel++) {
                const oldData = currentBuffer.getChannelData(channel);
                const newData = newBuffer.getChannelData(channel);

                // Copy part before the cut
                newData.set(oldData.subarray(0, startSample), 0);
                // Copy part after the cut
                newData.set(oldData.subarray(endSample), startSample);
            }

            currentBuffer = newBuffer;
            updateDurationDisplay();

            // Reload into native mobile player
            const blob = audioBufferToWav(currentBuffer);
            player.src = URL.createObjectURL(blob);
            
            // Clear inputs
            document.getElementById('cutStart').value = '';
            document.getElementById('cutEnd').value = '';
            document.getElementById('statusText').style.display = "none";
        }, 100);
    });

    // --- APPLY EFFECTS AND DOWNLOAD (MOBILE COMPATIBLE WAV) ---
    document.getElementById('btnDownload').addEventListener('click', () => {
        if (!currentBuffer) return;
        
        document.getElementById('statusText').style.display = "block";
        document.getElementById('statusText').innerText = "Applying final effects & rendering...";

        const speed = parseFloat(document.getElementById('speedSlider').value);
        const bassGain = parseFloat(document.getElementById('bassSlider').value);
        const reverbMix = parseFloat(document.getElementById('reverbSlider').value);

        // Mobile Safe Offline Render Context
        const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(
            currentBuffer.numberOfChannels,
            Math.floor((currentBuffer.length / speed)),
            currentBuffer.sampleRate
        );

        // Source Node
        const source = offlineCtx.createBufferSource();
        source.buffer = currentBuffer;
        source.playbackRate.value = speed;

        let lastNode = source;

        // Apply Bass Filter if modified
        if (bassGain !== 0) {
            const bass = offlineCtx.createBiquadFilter();
            bass.type = 'lowshelf';
            bass.frequency.setValueAtTime(200, 0);
            bass.gain.setValueAtTime(bassGain, 0);
            lastNode.connect(bass);
            lastNode = bass;
        }

        // Apply Reverb Approximation if modified
        if (reverbMix > 0) {
            const delay = offlineCtx.createDelay();
            delay.delayTime.setValueAtTime(0.12, 0);
            const revGain = offlineCtx.createGain();
            revGain.gain.setValueAtTime((reverbMix / 100) * 0.5, 0);

            lastNode.connect(offlineCtx.destination); // Direct dry sound
            lastNode.connect(delay);
            delay.connect(revGain);
            revGain.connect(offlineCtx.destination);
        } else {
            lastNode.connect(offlineCtx.destination);
        }

        source.start(0);

        offlineCtx.startRendering().then(renderedBuffer => {
            const wavBlob = audioBufferToWav(renderedBuffer);
            const url = URL.createObjectURL(wavBlob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mobile_edited_audio.wav';
            a.click();
            
            document.getElementById('statusText').style.display = "none";
        }).catch(e => {
            alert("Render error on mobile: " + e);
            document.getElementById('statusText').style.display = "none";
        });
    });

    // Convert Buffer to Clean 16-bit PCM WAV (Standard Mobile Support)
    function audioBufferToWav(buffer) {
        let numOfChan = buffer.numberOfChannels,
            length = buffer.length * numOfChan * 2 + 44,
            bufferArr = new ArrayBuffer(length),
            view = new DataView(bufferArr),
            channels = [], i, sample, offset = 0, pos = 0;

        setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
        setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
        setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

        for(i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

        while(pos < length) {
            for(i = 0; i < numOfChan; i++) {
                sample = Math.max(-1, Math.min(1, channels[i][offset]));
                sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF);
                view.setInt16(pos, sample, true); pos += 2;
            }
            offset++;
        }
        return new Blob([bufferArr], {type: 'audio/wav'});
        function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
        function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
    }
</script>

</body>
</html>
