<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Pro Video Editor - Canvas Engine</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --bg: #09090b;
            --panel: #18181b;
            --text: #f4f4f5;
            --accent: #a855f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background-color: var(--bg); color: var(--text);
            display: flex; 
            flex-direction: column; 
            justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }

        .container {
            background-color: var(--panel); border-radius: 20px; padding: 30px;
            width: 100%; max-width: 1100px;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
            display: grid; grid-template-columns: 1fr 1fr; gap: 30px;
            border: 1px solid #27272a;
        }

        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .header { grid-column: 1 / -1; text-align: center; border-bottom: 1px solid #27272a; padding-bottom: 20px; }
        .header h1 { font-size: 26px; font-weight: 700; background: linear-gradient(to right, #8b5cf6, #3b82f6); -webkit-background-clip: text; color: transparent; text-transform: uppercase; letter-spacing: 2px; }

        .video-section { display: flex; flex-direction: column; gap: 15px; }

        .upload-btn {
            background: linear-gradient(135deg, #27272a, #18181b); color: var(--text);
            padding: 15px; border-radius: 12px; text-align: center; cursor: pointer;
            border: 2px dashed #52525b; transition: 0.3s; font-weight: 600;
        }
        .upload-btn:hover { border-color: var(--primary); box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }
        input[type="file"] { display: none; }

        .video-container {
            background: #000; border-radius: 12px; overflow: hidden;
            aspect-ratio: 16/9; position: relative; border: 1px solid #3f3f46;
            display: flex; align-items: center; justify-content: center;
        }

        canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
        video { display: none; } 

        .controls-wrapper { display: flex; flex-direction: column; gap: 20px; max-height: 500px; overflow-y: auto; padding-right: 10px; }
        .controls-wrapper::-webkit-scrollbar { width: 6px; }
        .controls-wrapper::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }

        .control-group { display: flex; flex-direction: column; gap: 8px; background: #27272a; padding: 12px; border-radius: 10px; }
        .control-group label { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; color: #d4d4d8; text-transform: uppercase; letter-spacing: 0.5px; }
        .control-group label span { color: var(--accent); }

        input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: #3f3f46; border-radius: 5px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); cursor: pointer; transition: 0.2s; box-shadow: 0 0 10px var(--primary); }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }

        .action-btns { grid-column: 1 / -1; display: flex; justify-content: center; gap: 15px; margin-top: 10px; }
        button { padding: 14px 35px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }

        .play-btn { background-color: #3b82f6; color: white; }
        .play-btn:hover { background-color: #2563eb; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .reset-btn { background-color: #ef4444; color: white; }
        .reset-btn:hover { background-color: #dc2626; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        .download-btn { background: linear-gradient(45deg, var(--primary), var(--accent)); color: white; }
        .download-btn:hover { filter: brightness(1.2); box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
        .download-btn:disabled { background: #3f3f46; color: #a1a1aa; cursor: not-allowed; box-shadow: none; }

        #status { grid-column: 1 / -1; text-align: center; font-size: 15px; color: #10b981; font-weight: 600; min-height: 20px; }
        svg.filters { display: none; }
    </style>
</head>
<body>

    <svg class="filters">
        <defs>
            <filter id="sharpenFilter">
                <feConvolveMatrix id="sharpenMatrix" order="3" preserveAlpha="true" kernelMatrix="0 0 0 0 1 0 0 0 0"/>
            </filter>
        </defs>
    </svg>

    <div class="container">
        <div class="header">
            <h1>Ultra Pro Editor - V2</h1>
        </div>

        <div class="video-section">
            <label class="upload-btn">
                <span>📁 Select High-Res Video</span>
                <input type="file" id="video-upload" accept="video/*">
            </label>
            <div class="video-container">
                <video id="video-source" loop muted playsinline crossorigin="anonymous"></video>
                <canvas id="render-canvas"></canvas>
            </div>
            <div class="action-btns" style="margin-top: 0;">
                <button class="play-btn" id="play-pause-btn">Play / Pause</button>
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="control-group">
                <label>Sharpness <span id="sharp-val">0</span></label>
                <input type="range" id="sharpness" min="0" max="50" value="0">
            </div>
            <div class="control-group">
                <label>Clarity (Micro-Contrast) <span id="clarity-val">0</span></label>
                <input type="range" id="clarity" min="0" max="50" value="0">
            </div>
            <div class="control-group">
                <label>Glow (Bloom) <span id="glow-val">0%</span></label>
                <input type="range" id="glow" min="0" max="100" value="0">
            </div>
            <div class="control-group">
                <label>Smooth Glow <span id="smooth-glow-val">0%</span></label>
                <input type="range" id="smooth-glow" min="0" max="100" value="0">
            </div>
            
            <div class="control-group">
                <label>Brightness <span id="bright-val">100%</span></label>
                <input type="range" id="brightness" min="0" max="200" value="100">
            </div>
            <div class="control-group">
                <label>Contrast <span id="contrast-val">100%</span></label>
                <input type="range" id="contrast" min="0" max="200" value="100">
            </div>
            <div class="control-group">
                <label>Saturation <span id="saturation-val">100%</span></label>
                <input type="range" id="saturation" min="0" max="200" value="100">
            </div>
        </div>

        <div id="status">Upload a video to start editing.</div>

        <div class="action-btns">
            <button class="reset-btn" id="reset-btn">Reset All</button>
            <button class="download-btn" id="download-btn" disabled>Render & Download HD</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-source');
        const canvas = document.getElementById('render-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const statusText = document.getElementById('status');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const downloadBtn = document.getElementById('download-btn');
        const resetBtn = document.getElementById('reset-btn');
        const sharpenMatrix = document.getElementById('sharpenMatrix');

        let isRenderingMode = false;
        let animationFrameId = null;

        const sliders = {
            sharpness: document.getElementById('sharpness'),
            clarity: document.getElementById('clarity'),
            glow: document.getElementById('glow'),
            smoothGlow: document.getElementById('smooth-glow'),
            brightness: document.getElementById('brightness'),
            contrast: document.getElementById('contrast'),
            saturation: document.getElementById('saturation')
        };

        const values = {
            sharpness: document.getElementById('sharp-val'),
            clarity: document.getElementById('clarity-val'),
            glow: document.getElementById('glow-val'),
            smoothGlow: document.getElementById('smooth-glow-val'),
            brightness: document.getElementById('bright-val'),
            contrast: document.getElementById('contrast-val'),
            saturation: document.getElementById('saturation-val')
        };

        document.getElementById('video-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                statusText.innerText = "Processing video file...";
                video.src = URL.createObjectURL(file);
                video.load();
            }
        });

        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            downloadBtn.disabled = false;
            statusText.innerText = `Video Loaded (${video.videoWidth}x${video.videoHeight}). Apply effects!`;
            drawFrame(); 
        };

        playPauseBtn.addEventListener('click', () => {
            if (video.paused) { video.play(); } 
            else { video.pause(); }
        });

        function updateSVGFilters() {
            let sharpVal = parseFloat(sliders.sharpness.value) / 10; 
            let clarityVal = parseFloat(sliders.clarity.value) / 15; 
            let totalSharp = sharpVal + clarityVal; 
            
            if (totalSharp > 0) {
                let edge = -totalSharp;
                let center = 1 + (4 * totalSharp);
                sharpenMatrix.setAttribute('kernelMatrix', `0 ${edge} 0 ${edge} ${center} ${edge} 0 ${edge} 0`);
            }
        }

        function drawFrame() {
            if (!video.src || video.videoWidth === 0) return;

            // Update UI Labels
            values.sharpness.innerText = sliders.sharpness.value;
            values.clarity.innerText = sliders.clarity.value;
            values.glow.innerText = `${sliders.glow.value}%`;
            values.smoothGlow.innerText = `${sliders.smoothGlow.value}%`;
            values.brightness.innerText = `${sliders.brightness.value}%`;
            values.contrast.innerText = `${sliders.contrast.value}%`;
            values.saturation.innerText = `${sliders.saturation.value}%`;

            updateSVGFilters();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let filterStr = `brightness(${sliders.brightness.value}%) contrast(${sliders.contrast.value}%) saturate(${sliders.saturation.value}%) `;
            if (sliders.sharpness.value > 0 || sliders.clarity.value > 0) {
                filterStr = `url(#sharpenFilter) ` + filterStr;
            }

            try {
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;
                ctx.filter = filterStr;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                if (sliders.glow.value > 0) {
                    ctx.globalCompositeOperation = 'screen'; 
                    ctx.globalAlpha = sliders.glow.value / 100;
                    ctx.filter = `blur(8px) brightness(120%) saturate(150%)`;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }

                if (sliders.smoothGlow.value > 0) {
                    ctx.globalCompositeOperation = 'screen';
                    ctx.globalAlpha = sliders.smoothGlow.value / 100;
                    ctx.filter = `blur(35px) brightness(110%) saturate(120%)`;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }
            } catch(e) {
                console.log("Filter error fallback triggered");
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1.0;
            ctx.filter = 'none';

            // Fixed: Single controlled rendering loop to prevent duplicate animation triggers
            if (!video.paused && !video.ended) {
                animationFrameId = requestAnimationFrame(drawFrame);
            }
        }

        video.addEventListener('play', () => { 
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(drawFrame); 
        });
        
        // Fixed: Slider input draws cleanly only if video is paused to avoid loop crashing
        Object.values(sliders).forEach(slider => {
            slider.addEventListener('input', () => {
                if (video.paused) {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    animationFrameId = requestAnimationFrame(drawFrame); 
                }
            });
        });

        resetBtn.addEventListener('click', () => {
            sliders.sharpness.value = 0;
            sliders.clarity.value = 0;
            sliders.glow.value = 0;
            sliders.smoothGlow.value = 0;
            sliders.brightness.value = 100;
            sliders.contrast.value = 100;
            sliders.saturation.value = 100;
            if (video.paused) drawFrame();
        });

        downloadBtn.addEventListener('click', () => {
            if (!video.src) return;
            
            isRenderingMode = true;
            statusText.innerText = "🚨 Rendering Engine Active... DO NOT CLOSE TAB.";
            statusText.style.color = "#fbbf24";
            
            [downloadBtn, resetBtn, playPauseBtn, ...Object.values(sliders)].forEach(el => el.disabled = true);

            const videoStream = canvas.captureStream(30); // Optimized: Downscaled from 60fps to 30fps for stable rendering
            let audioStream = (video.captureStream || video.mozCaptureStream).call(video);
            if (audioStream && audioStream.getAudioTracks().length > 0) {
                videoStream.addTrack(audioStream.getAudioTracks()[0]);
            }

            const mediaRecorder = new MediaRecorder(videoStream, { 
                mimeType: 'video/webm; codecs=vp9',
                videoBitsPerSecond: 8000000 
            });
            const recordedChunks = [];

            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `Pro_Edited_Video_${Date.now()}.webm`;
                a.click();
                
                statusText.innerText = "✅ Download Complete!";
                statusText.style.color = "#10b981";
                [downloadBtn, resetBtn, playPauseBtn, ...Object.values(sliders)].forEach(el => el.disabled = false);
                isRenderingMode = false;
            };

            video.pause();
            video.currentTime = 0;
            video.loop = false; 
            
            video.onseeked = () => {
                mediaRecorder.start();
                video.play();
                video.onseeked = null;
            };

            video.onended = () => {
                mediaRecorder.stop();
                video.loop = true; 
            };
        });
    </script>

    <div style="width: 100%; max-width: 1100px; text-align: center; margin-top: 35px; display: block; clear: both;">
        <script async="async" data-cfasync="false" src="https://pl29620669.effectivecpmnetwork.com/6538d45e194262f6dc2f234c93ffc24c/invoke.js"></script>
        <div id="container-6538d45e194262f6dc2f234c93ffc24c"></div>
    </div>

</body>
